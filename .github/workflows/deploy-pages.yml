name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 检查 Pages 是否已启用（Actions 作为发布源）
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info(`Pages 已启用：build_type=${data.build_type}  html_url=${data.html_url}`);
              if (data.build_type !== 'workflow') {
                core.setFailed(
                  `Pages 的 Build and deployment Source 当前是 "${data.build_type}"，必须改为 "GitHub Actions"。` +
                  `请打开 https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages 修改`
                );
              }
            } catch (e) {
              core.setFailed(
                `仓库没有启用 GitHub Pages（HTTP ${e.status}）。` +
                `请打开 https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages ，` +
                `把 Build and deployment → Source 设为 "GitHub Actions" 后重跑本工作流。`
              );
            }

      - name: 规则引擎测试
        run: node test/rules.test.js

      - name: 生成单文件版
        run: node build.js

      - name: 组装发布目录
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r css js vendor dist _site/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
